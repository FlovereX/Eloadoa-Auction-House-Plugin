# Commands that open your AuctionHouse plugin.
command-labels:
  - ah
  - auctionhouse

# Listing subcommands to announce.
listing-subcommands:
  - sell
  - bid

# AuctionHouse keeps new listings on a setup/waiting list for the number of
# seconds in plugins/AuctionHouse/config.yml. The bridge reads that setting
# automatically and adds this small safety delay before confirming the listing.
extra-confirm-seconds: 1

debug: false

# Optional: have the bridge post its own Discord embed for each confirmed listing
# (through DiscordSRV's JDA connection) and then edit or delete that same message
# as the auction is sold, expires, or is cancelled/removed. This requires DiscordSRV
# to be installed and is an alternative to using AuctionListedEvent in alerts.yml.
discord:
  enabled: false

  # Discord channel ID to post auction embeds in.
  channel-id: "0"

  # How often, in seconds, to check on tracked auctions for a status change.
  check-interval-seconds: 10

  # How long, in seconds, to leave the final embed (sold/expired/removed) before
  # deleting it. Use 0 to never delete it automatically.
  delete-after-seconds: 300
